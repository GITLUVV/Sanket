# Default system configuration for Sanket

camera:
  device_id: 0
  width: 640
  height: 480
  fps: 30

landmarks:
  max_num_hands: 2
  min_detection_confidence: 0.7
  min_tracking_confidence: 0.5
  normalize_coordinates: true

model:
  architecture: "random_forest"
  confidence_threshold: 0.75
  smoothing_window_size: 5
  weights_path: null
